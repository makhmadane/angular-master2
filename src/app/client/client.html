<p>client works!</p>



<button (click)="getClient()">Send</button>

<table class="table table-striped table-bordered">
  <thead>
  <tr>
    <th>ID</th>
    <th>Titre</th>
    <th>Description</th>
    <th>Delete</th>
  </tr>
  </thead>

  <tbody>
    @for (p of posts(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.title }}</td>
        <td>{{ p.body }}</td>
        <td>
          <button (click)="deleteClient(p.id)" >Delete</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" class="text-center">
          Aucun article disponible
        </td>
      </tr>
    }
  </tbody>
</table>
